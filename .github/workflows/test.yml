name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/package-lock.json
      - name: Install dev-only test tools
        run: cd test && npm ci && npx playwright install --with-deps chromium
      - name: Unit, fixture and E2E suite (mocked Spaces)
        run: cd test && npm test -- ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: docs/review/evidence/round-ci/
